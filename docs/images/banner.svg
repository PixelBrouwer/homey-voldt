<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Voldt voor Homey</title><desc id="desc">Lokaal laden. Helder inzicht. Een onafhankelijke community-integratie van PixelBrouwer.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091628"/><stop offset="1" stop-color="#163a61"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#3688dc" stop-opacity=".32"/><stop offset="1" stop-color="#3688dc" stop-opacity="0"/></radialGradient>
    <clipPath id="banner"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#banner)">
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <ellipse cx="1050" cy="210" rx="370" ry="300" fill="url(#glow)"/>
  <g fill="none" stroke="#73baff" stroke-opacity=".1"><circle cx="1100" cy="190" r="170"/><circle cx="1100" cy="190" r="230"/><circle cx="1100" cy="190" r="290"/></g>
  <text x="64" y="72" fill="#80dfe1" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">COMMUNITY · PIXELBROUWER</text>
  <text x="60" y="158" fill="white" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="750" letter-spacing="-2">Voldt voor Homey</text>
  <text x="64" y="209" fill="#c6daf0" font-family="Segoe UI,Arial,sans-serif" font-size="27">Lokaal laden. Helder inzicht.</text>
  <text x="64" y="251" fill="#93acc9" font-family="Segoe UI,Arial,sans-serif" font-size="18">Je laadkabel bedienen en volgen vanuit je slimme huis.</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#d9eaff">
    <rect x="64" y="297" width="98" height="38" rx="19" fill="#23496c"/><text x="113" y="322" text-anchor="middle">Lokaal wifi</text>
    <rect x="174" y="297" width="101" height="38" rx="19" fill="#23496c"/><text x="224" y="322" text-anchor="middle">Vermogen</text>
    <rect x="287" y="297" width="87" height="38" rx="19" fill="#23496c"/><text x="330" y="322" text-anchor="middle">Energie</text>
    <rect x="386" y="297" width="75" height="38" rx="19" fill="#23496c"/><text x="423" y="322" text-anchor="middle">Flows</text>
  </g>
  <image href="voldt-product-transparent.png" x="820" y="-20" width="440" height="440" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
