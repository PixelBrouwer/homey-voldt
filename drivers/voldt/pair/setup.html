<style>
  .voldt { max-width: 640px; margin: 0 auto; font: 16px/1.5 system-ui,sans-serif; }
  .voldt h1 { font-size: 24px; } .voldt label { display:block; margin:16px 0 5px; }
  .voldt input,.voldt select,.voldt button { box-sizing:border-box; width:100%; padding:12px; font:inherit; border-radius:7px; }
  .voldt details { margin:20px 0; } .voldt summary { cursor:pointer; }
  .voldt button { margin:20px 0 12px; background:#164d8e; color:white; border:0; }
  .voldt button:disabled { opacity:.6; } .voldt .notice { font-size:14px; opacity:.8; }
  .voldt #error { color:#bc3434; }
</style>
<main class="voldt">
  <h1 data-i18n="pair.title"></h1><p data-i18n="pair.intro"></p>
  <form id="login">
    <label for="email" data-i18n="pair.email"></label><input id="email" type="email" autocomplete="username" maxlength="254" required>
    <label for="password" data-i18n="pair.password"></label><input id="password" type="password" autocomplete="current-password" maxlength="1024" required>
    <details><summary data-i18n="pair.advanced"></summary>
      <label for="country" data-i18n="pair.country"></label><input id="country" value="31" inputmode="numeric" pattern="[0-9]{1,4}" required>
      <label for="region" data-i18n="pair.region"></label><select id="region"><option value="eu" data-i18n="pair.eu"></option><option value="us" data-i18n="pair.us"></option><option value="in" data-i18n="pair.in"></option><option value="ru" data-i18n="pair.ru"></option></select>
      <label for="host" data-i18n="pair.host"></label><input id="host" autocomplete="off" inputmode="decimal">
    </details>
    <button id="submit" type="submit" data-i18n="pair.login"></button>
  </form>
  <p class="notice" data-i18n="pair.privacy"></p><p id="status" role="status" aria-live="polite"></p><p id="error" role="alert"></p>
  <button id="done" type="button" hidden data-i18n="pair.done"></button>
</main>
<script>
  (() => {
    const el=id=>document.getElementById(id);
    document.querySelectorAll('[data-i18n]').forEach(node=>{node.textContent=Homey.__(node.dataset.i18n);});
    Homey.setTitle(Homey.__('pair.title'));
    el('done').addEventListener('click',()=>Homey.done());
    el('login').addEventListener('submit',async event=>{
      event.preventDefault();el('submit').disabled=true;el('error').textContent='';el('status').textContent=Homey.__('pair.working');
      try {
        const pending=Homey.emit('account_login',{email:el('email').value.trim(),password:el('password').value,countryCode:el('country').value,region:el('region').value,host:el('host').value.trim()||undefined});
        el('password').value='';
        const result=await pending;
        if(result.repaired){el('login').hidden=true;el('status').textContent=Homey.__('pair.repaired');el('done').hidden=false;}
        else if(result.alreadyAdded){el('status').textContent=Homey.__('pair.already');}
        else if(!result.found){el('status').textContent=Homey.__('pair.empty');}
        else await Homey.showView('list_devices');
      }catch(error){el('status').textContent='';el('error').textContent=error.message||Homey.__('errors.ONBOARDING_FAILED');}
      finally{el('password').value='';el('submit').disabled=false;}
    });
  })();
</script>
